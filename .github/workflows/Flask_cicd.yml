name: CI/CD for Flask Travel application

on:
  push:
    branches:
      - main
    paths:
      - 'Flask_app_project/**'

  pull_request:
    branches:
      - main
    paths:
      - 'Flask_app_project/**'

jobs:
    # for build and test the application
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Flask_app_project

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flask
        pip install pytest

    - name: Run tests
      run: |
        pytest

  build-and-publish:
    needs: build-and-test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Flask_app_project
        
    steps:
    - name: Checkout code   
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    
    - name: Build and push Docker image
      uses: docker/build-push-action@v3
      with:
        context: ./Flask_app_project
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/flask-travel-app:latest

    - name: image digest
      run: |
        echo "Image digest: ${{ steps.build-and-publish.outputs.digest }}"

